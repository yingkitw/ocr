[package]
name = "ocr"
version = "0.1.4"
edition = "2024"
authors = ["Ying Kit WONG"]
description = "Pure Rust OCR engine and CLI for extracting printed text from images. Supports 25+ languages, CRNN/CTC recognition, multi-page TIFF, table and form extraction, and output to text, JSON, Markdown, hOCR, TSV, CSV, ALTO XML, PAGE XML, and searchable PDF."
license = "Apache-2.0"
repository = "https://github.com/yingkitw/ocr"
homepage = "https://github.com/yingkitw/ocr"
documentation = "https://docs.rs/ocr"
readme = "README.md"
keywords = ["ocr", "tesseract", "image-to-text", "text-recognition", "pure-rust", "crnn", "ctc", "document-ai", "image-processing"]
categories = ["command-line-utilities", "multimedia::images", "text-processing", "science", "computer-vision"]
exclude = [
    "examples/images/*",
    "target/*",
    ".git/*",
]

[[bin]]
name = "ocr"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "fs", "sync", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std", "ansi"] }

thiserror = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
imageproc = "0.23"
ndarray = "0.15"
rand = "0.8"
rayon = "1.8"
rusttype = "0.9"
tiff = "0.9"

# Optional / heavy
axum = { version = "0.7", features = ["multipart"], optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = ["cors", "limit"], optional = true }
multer = { version = "3", optional = true }
cudarc = { version = "0.12", optional = true, features = ["cuda-12040"] }
ocl = { version = "0.19", optional = true }
onnx-rs = { version = "0.1", optional = true }
reqwest = { version = "0.12", features = ["multipart", "json"], optional = true }

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0"
insta = "1.0"

[features]
default = ["simd"]
simd = []
# Searchable PDF output (image + invisible text layer, zero external deps)
pdf = []
# PDF feature placeholder (no external deps) — kept for backward compat, use `pdf` instead
pdfrs = []
web-api = ["dep:axum", "dep:tower", "dep:tower-http", "dep:multer", "dep:reqwest"]
cuda = ["dep:cudarc"]
opencl = ["dep:ocl"]
opencv = []
onnx = ["dep:onnx-rs"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
